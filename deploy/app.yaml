# Mockarty row #18 deploy acceptance fixture — service A (isolated verification cluster).
# The Mockarty kubernetes deployer applies this manifest to the target namespace
# named by its delivery-config target (mockarty-prod-verify). The workload is a
# plain HTTP server so `kubectl rollout status` proves the real rollout, and the
# post-deploy observation window is served by the stand's Prometheus-compatible
# observability fixture.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: row18-svc-a
  labels:
    app: row18-svc-a
    mockarty.dev/row: "18"
    mockarty.dev/service: svc-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: row18-svc-a
  template:
    metadata:
      labels:
        app: row18-svc-a
        mockarty.dev/row: "18"
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: row18-svc-a
  labels:
    app: row18-svc-a
    mockarty.dev/row: "18"
spec:
  selector:
    app: row18-svc-a
  ports:
    - name: http
      port: 80
      targetPort: 80
